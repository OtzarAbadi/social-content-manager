spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0
server.servlet.context-path=/api

sscm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_PUBLIC_URL:}}
sscm.cors.allowed-origin-patterns=
sscm.auth.cookie.secure=${COOKIE_SECURE:true}
sscm.auth.cookie.same-site=${COOKIE_SAME_SITE:None}
sscm.auth.cookie.expose-token=false
sscm.storage.require-cloudinary=true

sscm.publishing.provider=${SSCM_PUBLISHING_PROVIDER:LOCAL}
sscm.publishing.scheduling.enabled=${SSCM_PUBLISHING_SCHEDULING_ENABLED:true}
sscm.publishing.scheduling.fixed-delay-ms=${SSCM_PUBLISHING_FIXED_DELAY_MS:60000}
sscm.publishing.scheduling.initial-delay-ms=${SSCM_PUBLISHING_INITIAL_DELAY_MS:30000}
sscm.publishing.scheduling.batch-size=${SSCM_PUBLISHING_BATCH_SIZE:25}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
