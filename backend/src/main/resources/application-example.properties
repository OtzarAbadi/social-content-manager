spring.application.name=social-content-manager
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0
server.servlet.context-path=/api
sscm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
sscm.cors.allowed-origin-patterns=http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.*.*.*:5173
sscm.auth.cookie.secure=${COOKIE_SECURE:false}
sscm.auth.cookie.same-site=${COOKIE_SAME_SITE:Lax}
sscm.auth.cookie.expose-token=true
sscm.storage.require-cloudinary=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/social_content_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

sscm.publishing.provider=${SSCM_PUBLISHING_PROVIDER:LOCAL}
sscm.publishing.scheduling.enabled=${SSCM_PUBLISHING_SCHEDULING_ENABLED:true}
sscm.publishing.scheduling.fixed-delay-ms=60000
sscm.publishing.scheduling.initial-delay-ms=30000
sscm.publishing.scheduling.batch-size=25

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
