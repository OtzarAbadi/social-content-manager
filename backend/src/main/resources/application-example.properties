spring.application.name=social-content-manager
sscm.cors.allowed-origin-patterns=http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.*.*.*:5173

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/social_content_manager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

sscm.publishing.provider=LOCAL
sscm.publishing.scheduling.enabled=true
sscm.publishing.scheduling.fixed-delay-ms=60000
sscm.publishing.scheduling.initial-delay-ms=30000
sscm.publishing.scheduling.batch-size=25

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
