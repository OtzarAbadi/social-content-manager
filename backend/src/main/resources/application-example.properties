spring.application.name=social-content-manager

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/social_content_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
sscm.publishing.provider=LOCAL
sscm.publishing.scheduling.enabled=true
sscm.publishing.scheduling.fixed-delay-ms=60000
sscm.publishing.scheduling.initial-delay-ms=30000
sscm.publishing.scheduling.batch-size=25

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
