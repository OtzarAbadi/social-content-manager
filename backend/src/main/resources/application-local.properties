spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/social_content_manager?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT:8081}
server.address=0.0.0.0
server.servlet.context-path=/api

sscm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
sscm.auth.cookie.secure=${COOKIE_SECURE:false}
sscm.auth.cookie.same-site=${COOKIE_SAME_SITE:Lax}
sscm.auth.cookie.expose-token=true
sscm.storage.require-cloudinary=false
sscm.storage.path=${SSCM_STORAGE_PATH:}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
